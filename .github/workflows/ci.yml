name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check bot tests

      - name: Форматирование
        run: ruff format --check bot tests

      - name: Тесты
        run: pytest -q

      - name: Проверка миграций (накат и откат)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.sqlite3
        run: |
          alembic upgrade head
          alembic downgrade base

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t leadbot:ci .
